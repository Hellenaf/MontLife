<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="montBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#18153a" />
      <stop offset="100%" stop-color="#0a0818" />
    </linearGradient>
    <linearGradient id="montGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="montGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="summitGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#montBg)" />
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="rgba(168, 85, 247, 0.25)" stroke-width="2" />

  <!-- Mountain Peak 1 (Left Wing of M) -->
  <path
    d="M104 380 L188 188 C194 174 214 174 220 188 L256 268 L176 380 Z"
    fill="url(#montGrad1)"
    opacity="0.9"
  />

  <!-- Mountain Peak 2 (Center Ascending Summit of M / Peak Arrow) -->
  <path
    d="M256 120 L340 320 L276 380 L236 380 L196 320 Z"
    fill="url(#montGrad2)"
    filter="url(#glow)"
  />

  <!-- Main M Modern Facet Lines -->
  <!-- Left Leg -->
  <path
    d="M108 384 L184 196 C190 182 208 182 214 196 L256 288 L298 196 C304 182 322 182 328 196 L404 384"
    stroke="url(#montGrad1)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Ascending Arrow / Summit Notch -->
  <path
    d="M256 128 L304 220 L256 200 L208 220 Z"
    fill="#FFFFFF"
  />

  <!-- Peak Dot / Polaris North Star Accent -->
  <circle cx="256" cy="96" r="14" fill="#38BDF8" filter="url(#glow)" />
</svg>

